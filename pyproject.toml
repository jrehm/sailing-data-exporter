[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sailing-data-exporter"
description = "Flask webapp to export sailing race data from InfluxDB as CSV"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dynamic = ["version"]
keywords = ["sailing", "signalk", "influxdb", "flask", "csv"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "flask>=3.1",
    "influxdb-client>=1.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
sailing-data-exporter = "app:main"

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

# MEASUREMENT_GROUPS is intentionally one tuple per line — the README
# documents "adding a new measurement is a one-line addition".
[tool.ruff.lint.per-file-ignores]
"app.py" = ["E501"]
